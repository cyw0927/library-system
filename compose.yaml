services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: library_app
      POSTGRES_USER: library_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - library_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_app -d library_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  library_pg:
