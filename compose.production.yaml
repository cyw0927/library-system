# Standalone: do NOT merge with compose.yaml (which publishes a development DB port).
name: library-production
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_app
      POSTGRES_USER: library_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["production_pg:/var/lib/postgresql"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_app -d library_app"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    image: library-app:operations
    environment: &backend_env
      APP_ENV: production
      AUTH_REQUIRED: "true"
      LIBRARY_SECRETS_DIR: /run/secrets
      ALLOWED_HOSTS: '["api","localhost","127.0.0.1"]'
      GITHUB_USE_GIT_CREDENTIALS: "false"
      DATABASE_TIMEOUT_SECONDS: "30"
    secrets: &backend_secrets [database_url, github_token]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    image: library-app:operations
    restart: unless-stopped
    environment: *backend_env
    secrets: *backend_secrets
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [private, outbound]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
  frontend:
    image: library-app:operations
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      LIBRARY_API_URL: http://api:8000
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to your hostname}
    secrets: [streamlit_cookie_secret]
    command: ["python", "-m", "scripts.serve_frontend"]
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/home/library/.streamlit:rw,noexec,nosuid,uid=10001,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
  proxy:
    image: nginx:stable-alpine
    user: "101:101"
    restart: unless-stopped
    # Local TLS preview only. Expose public 443 only AFTER the deployment checklist.
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      frontend: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,uid=101,size=32m", "/var/run:rw,noexec,nosuid,uid=101,size=16m", "/tmp:rw,noexec,nosuid,uid=101,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  production_pg:
networks:
  private: {internal: true}
  outbound: {}
secrets:
  postgres_password: {file: ./deploy/secrets/postgres_password}
  database_url: {file: ./deploy/secrets/database_url}
  github_token: {file: ./deploy/secrets/github_token}
  streamlit_cookie_secret: {file: ./deploy/secrets/streamlit_cookie_secret}
  tls_certificate: {file: ./deploy/tls/fullchain.pem}
  tls_private_key: {file: ./deploy/tls/privkey.pem}
