# Standalone: do NOT merge with compose.yaml (which publishes a development DB port).
name: library-production
x-logging: &rotating_logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    logging: *rotating_logs
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_app
      POSTGRES_USER: library_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["production_pg:/var/lib/postgresql"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_owner -d library_app"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    logging: *rotating_logs
    build: .
    image: library-app:operations
    environment: &backend_env
      APP_ENV: production
      AUTH_REQUIRED: "true"
      LIBRARY_SECRETS_DIR: /run/secrets
      ALLOWED_HOSTS: '["api","localhost","127.0.0.1"]'
      GITHUB_USE_GIT_CREDENTIALS: "false"
      PAID_AI_ENABLED: "false"
      DATABASE_TIMEOUT_SECONDS: "30"
    secrets:
      - source: migration_database_url
        target: database_url
      - runtime_password
    command: ["python", "-m", "scripts.bootstrap_production"]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    logging: *rotating_logs
    image: library-app:operations
    restart: unless-stopped
    environment: *backend_env
    secrets: [database_url, github_token]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [private, outbound]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
  frontend:
    logging: *rotating_logs
    image: library-app:operations
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      LIBRARY_API_URL: http://api:8000
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to your hostname}
    secrets: [streamlit_cookie_secret]
    command: ["python", "-m", "scripts.serve_frontend"]
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/home/library/.streamlit:rw,noexec,nosuid,uid=10001,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
  proxy:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    logging: *rotating_logs
    mem_limit: 128m
    user: "101:101"
    restart: unless-stopped
    # Local TLS preview only. Expose public 443 only AFTER the deployment checklist.
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      frontend: {condition: service_healthy}
    networks: [private, edge]
    read_only: true
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,uid=101,size=32m", "/var/run:rw,noexec,nosuid,uid=101,size=16m", "/tmp:rw,noexec,nosuid,uid=101,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  backup:
    profiles: [operations]
    image: library-app:operations
    environment: *backend_env
    secrets: [database_url]
    command: ["python", "-m", "scripts.backup_job", "--directory", "/backups"]
    # Start only the existing DB, never app migrations for a backup job.
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    volumes: ["production_backups:/backups"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *rotating_logs
    mem_limit: 512m
volumes:
  production_pg:
  # New volume inherits /backups UID10001 from the image; never mount shared storage.
  production_backups:
networks:
  private: {internal: true}
  outbound: {}
  edge: {}
secrets:
  postgres_password: {file: ./deploy/secrets/postgres_password}
  database_url: {file: ./deploy/secrets/database_url}
  migration_database_url: {file: ./deploy/secrets/migration_database_url}
  runtime_password: {file: ./deploy/secrets/runtime_password}
  github_token: {file: ./deploy/secrets/github_token}
  streamlit_cookie_secret: {file: ./deploy/secrets/streamlit_cookie_secret}
  tls_certificate: {file: ./deploy/tls/fullchain.pem}
  tls_private_key: {file: ./deploy/tls/privkey.pem}
