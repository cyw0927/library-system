worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # Never log passwords, Bearer tokens, cookies or search query strings.
    log_format private '$remote_addr $request_method $uri $status';
    access_log /dev/stdout private;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32k;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-store always;
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api:8000/auth/login;
            proxy_set_header Host api;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api:8000/;
            proxy_set_header Host api;
            proxy_read_timeout 180s;
        }
        location / {
            proxy_pass http://frontend:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }
    }
}
