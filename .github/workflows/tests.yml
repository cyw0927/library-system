name: Phase 1 foundation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: test%password
          POSTGRES_DB: library_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_test -d library_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://library_test:test%25password@127.0.0.1:5432/library_app_test
      TEST_DATABASE_URL: postgresql+psycopg://library_test:test%25password@127.0.0.1:5432/library_app_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -ra -s
