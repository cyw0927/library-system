name: Library backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: test%password
          POSTGRES_DB: library_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_test -d library_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://library_test:test%25password@127.0.0.1:5432/library_app_test
      TEST_DATABASE_URL: postgresql+psycopg://library_test:test%25password@127.0.0.1:5432/library_app_test
      PGVECTOR_REQUIRED: "1"
      PG_BACKUP_REQUIRED: "1"
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-frontend.txt
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Install matching PostgreSQL 18 backup tools
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/library-pgdg.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client-18
          fi
      - name: Check dependencies
        run: python -m pip check
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Verify model and migration consistency
        run: python -m alembic check
      - name: Enable real pgvector retrieval
        run: python -m scripts.enable_pgvector
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -ra -s

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test isolated TLS production stack
        run: python -m scripts.ci_production_smoke
